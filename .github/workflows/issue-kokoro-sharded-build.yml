name: Sharded Kokoro work-English audio build

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  kickoff:
    if: github.event.issue.title == '[KOKORO_BUILD] Generate sharded audio'
    runs-on: ubuntu-latest
    steps:
      - name: Report run start
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "RUN_ID=${GITHUB_RUN_ID} STATUS=STARTED MODE=SHARDED"

  generate:
    needs: kickoff
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kokoro-audio-run-20260729-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: kokoro-build/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - run: python -m pip install --upgrade pip && pip install -r kokoro-build/requirements.txt
      - name: Generate shard ${{ matrix.shard }}
        env:
          KOKORO_VOICE: af_heart
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: '4'
          HF_HOME: ${{ runner.temp }}/huggingface
        run: python kokoro-build/generate_sharded.py
      - name: Verify shard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('kokoro-build/out')
          files=list(folder.glob('*.mp3'))
          assert files
          assert max(p.stat().st_size for p in files) < 200*1024
          failures=[]
          for p in folder.glob('failures-*.json'):
              failures += json.loads(p.read_text(encoding='utf-8'))
          assert not failures, failures[:3]
          print({'files':len(files),'max_bytes':max(p.stat().st_size for p in files)})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokoro-shard-${{ matrix.shard }}
          path: kokoro-build/out/
          compression-level: 6
          retention-days: 7

  aggregate:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kokoro-shard-*
          path: merged
          merge-multiple: true
      - name: Validate complete pack
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('merged')
          files=sorted(folder.glob('*.mp3'))
          assert len(files)==1034, f'Expected 1034 MP3 files, found {len(files)}'
          sizes=[p.stat().st_size for p in files]
          assert max(sizes)<200*1024
          failures=[]
          for p in folder.glob('failures-*.json'):
              failures += json.loads(p.read_text(encoding='utf-8'))
          assert not failures, failures[:3]
          report={'voice':'af_heart','normal_speed':1.0,'slow_speed':0.85,'unique_texts':517,'mp3_files':len(files),'max_bytes':max(sizes),'total_bytes':sum(sizes)}
          (folder/'BUILD_REPORT.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(report)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kokoro-work-english-full-audio-sharded
          path: merged/
          compression-level: 6
          retention-days: 7
      - name: Report completion
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "RUN_ID=${GITHUB_RUN_ID} STATUS=COMPLETED MODE=SHARDED"

  report-failure:
    if: failure()
    needs: [kickoff, generate, aggregate]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "RUN_ID=${GITHUB_RUN_ID} STATUS=FAILED MODE=SHARDED"
